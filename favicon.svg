<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.6)"/>
      <stop offset="50%" stop-color="rgba(129, 140, 248, 0.4)"/>
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0.6)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background squircle with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Subtle quantum / neural node accent lines -->
  <circle cx="16" cy="18" r="2" fill="#38bdf8" opacity="0.7"/>
  <circle cx="48" cy="46" r="2" fill="#c084fc" opacity="0.7"/>
  <path d="M 16 18 Q 32 32 48 46" stroke="url(#brandGrad)" stroke-width="0.8" fill="none" opacity="0.25" stroke-dasharray="2 2"/>

  <!-- Monogram CM -->
  <text x="32" y="34.5" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif" 
        font-weight="900" 
        font-size="27" 
        letter-spacing="-1.8px" 
        text-anchor="middle" 
        dominant-baseline="central" 
        fill="url(#brandGrad)" 
        filter="url(#glow)">CM</text>

  <!-- Active emerald beacon dot -->
  <circle cx="48" cy="16" r="3" fill="#10b981"/>
  <circle cx="48" cy="16" r="4.5" fill="none" stroke="#34d399" stroke-width="1" opacity="0.75"/>
</svg>
